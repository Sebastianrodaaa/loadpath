[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loadpath"
version = "0.1.0"
description = "Trace model-loading call sites to artifact scanner coverage."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sebastian Roda"}]
requires-python = ">=3.10"
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4", "picklescan==1.0.4", "modelscan==0.8.8"]

[project.scripts]
loadpath = "loadpath.cli:main"

[tool.setuptools]
packages = ["loadpath"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
